services:
  db:
    container_name: teamlink-postgres
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-teamlink}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-postgres}"
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - teamlink-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    container_name: teamlink-api
    build:
      context: ./Backend
      dockerfile: Dockerfile
    env_file:
      - path: .env
        required: false
    environment:
      - ConnectionStrings__DefaultConnection
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Enable Frontend once the application and its Dockerfile are ready

volumes:
  teamlink-postgres-data: